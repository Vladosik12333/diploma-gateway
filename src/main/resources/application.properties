spring.application.name=diploma-gateway

spring.config.import=file:./.env[.properties]

spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

server.port=8080

gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4040}
gateway.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
gateway.cors.allowed-headers=*

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# Swagger UI aggregating the services

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.urls[0].name=trip-service
springdoc.swagger-ui.urls[0].url=/docs/trip-service

# Routes

# Trip Service
spring.cloud.gateway.server.webmvc.routes[0].id=trip-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${TRIP_SERVICE_URL:http://localhost:9091}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/trips/**,/api/v1/categories/**,/api/v1/locations/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=trip-service
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/trip-service
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.statusCodes=500,502,503,504

spring.cloud.gateway.server.webmvc.routes[1].id=trip-service-docs
spring.cloud.gateway.server.webmvc.routes[1].uri=${TRIP_SERVICE_URL:http://localhost:9091}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/docs/trip-service
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=SetPath=/api/v3/api-docs
